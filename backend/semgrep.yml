rules:
  - id: vajra-python-sql-injection
    languages: [python]
    message: User-controlled data reaches a SQL execution sink.
    severity: ERROR
    mode: taint
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern: request.args.get(...)
              - pattern: request.form.get(...)
              - pattern: request.values.get(...)
              - pattern: request.json.get(...)
              - pattern: request.args[...]
              - pattern: request.form[...]
    pattern-sinks:
      - pattern-either:
          - pattern: $DB.execute($QUERY)
          - pattern: $DB.executemany($QUERY)
          - pattern: $DB.executescript($QUERY)

  - id: vajra-python-command-injection
    languages: [python]
    message: User-controlled data reaches a shell execution sink.
    severity: ERROR
    mode: taint
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern: request.args.get(...)
              - pattern: request.form.get(...)
              - pattern: request.values.get(...)
              - pattern: request.json.get(...)
              - pattern: request.args[...]
              - pattern: request.form[...]
    pattern-sinks:
      - pattern-either:
          - pattern: subprocess.$FUNC(..., shell=True, ...)
          - pattern: os.system(...)
          - pattern: os.popen(...)
