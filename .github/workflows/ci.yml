name: VAJRA CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q backend

      - name: Run analyzer tests
        run: pytest -q backend/test_analyzer.py

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  docker:
    name: Docker Build & Compose Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose configuration
        run: docker compose config -q

      - name: Build backend Docker image
        run: docker compose build backend

      - name: Build frontend Docker image
        run: docker compose build frontend

  integration:
    name: Full Stack Integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start VAJRA stack
        run: docker compose up -d --build

      - name: Show running containers
        run: docker compose ps

      - name: Wait for backend health
        shell: bash
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:8000/api/health > /tmp/backend-health.json; then
              echo "Backend is healthy."
              cat /tmp/backend-health.json
              exit 0
            fi

            echo "Waiting for backend... attempt $i/30"
            sleep 2
          done

          echo "Backend did not become healthy."
          docker compose ps
          docker compose logs backend --tail=100
          exit 1

      - name: Verify frontend
        shell: bash
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:8080/ > /tmp/frontend.html; then
              echo "Frontend is reachable."
              head -c 500 /tmp/frontend.html
              echo
              exit 0
            fi

            echo "Waiting for frontend... attempt $i/30"
            sleep 2
          done

          echo "Frontend did not become reachable."
          docker compose ps
          docker compose logs frontend --tail=100
          exit 1

      - name: Show service status
        if: always()
        run: docker compose ps

      - name: Show backend logs on failure
        if: failure()
        run: docker compose logs backend --tail=100

      - name: Show frontend logs on failure
        if: failure()
        run: docker compose logs frontend --tail=100

      - name: Stop VAJRA stack
        if: always()
        run: docker compose down -v

  security:
    name: Semgrep Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Semgrep
        run: pip install "semgrep>=1.130.0"

      - name: Run VAJRA security rules
        run: |
          semgrep \
            --config backend/semgrep.yml \
            backend \
            --error \
            --metrics=off

  dependencies:
    name: Dependency Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker compose build backend

      - name: Create temporary backend container
        run: |
          docker create --name vajra-backend-scan vajra-backend:latest

      - name: Extract installed Python packages
        run: |
          mkdir -p scan/site-packages
          docker cp vajra-backend-scan:/usr/local/lib/python3.12/site-packages/. scan/site-packages/

      - name: Generate SBOM with Syft
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/scan:/scan" \
            vajra-backend:latest \
            syft dir:/scan/site-packages \
            -o cyclonedx-json=/scan/backend-installed-packages.cdx.json

      - name: Scan SBOM with OSV-Scanner
        continue-on-error: true
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/scan:/scan" \
            vajra-backend:latest \
            osv-scanner scan /scan/backend-installed-packages.cdx.json

      - name: Upload dependency SBOM
        uses: actions/upload-artifact@v4
        with:
          name: vajra-dependency-sbom
          path: scan/backend-installed-packages.cdx.json
          if-no-files-found: error

      - name: Remove temporary container
        if: always()
        run: docker rm -f vajra-backend-scan || true